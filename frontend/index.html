<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F8FAFD" />
    <meta name="description" content="Cyclone impact screening for disaster officials and responders in India." />
    <script>
      // Apply the saved theme before the first paint so the page never flashes the wrong colours.
      try {
        var p = JSON.parse(localStorage.getItem('surgesight.prefs') || '{}').state || {}
        var t = p.theme || 'system'
        if (t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
    <title>SurgeSight</title>
  </head>
  <body>
    <div id="root">
      <div style="height:100%;display:grid;place-items:center;font:500 14px system-ui,sans-serif;color:#8b939d">Loading SurgeSight…</div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
